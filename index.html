<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazacote - Re</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            color: #aaa;
        }
        #container {
            text-align: center;
            background: #1a1a1a;
            padding: 40px 60px;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.05);
        }
        canvas {
            display: block;
            margin: 20px auto;
            border-radius: 20px;
            background: #111;
            cursor: pointer;
            touch-action: none;
        }
        .info {
            font-size: 14px;
            letter-spacing: 2px;
            color: #666;
        }
        .info span {
            color: #8cf;
        }
        .estado {
            margin-top: 12px;
            font-size: 18px;
            color: #4af;
        }
        #startBtn {
            background: #2a4a6a;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
            font-family: monospace;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        #startBtn:hover {
            background: #3a6a9a;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }
    </style>
</head>
<body>

<div id="container">
    <h2 style="font-weight:300; letter-spacing:4px;">◈ MAZACOTE · RE ◈</h2>
    <button id="startBtn">▶ INICIAR AUDIO</button>
    <canvas id="manoCanvas" width="400" height="200"></canvas>
    <div class="info">
        <span>⬆⬇</span> vertical = textura · <span>✋ izquierda/derecha</span> = volumen
    </div>
    <div class="estado" id="estadoTexto">⚪ esperando inicio...</div>
</div>

<script>
    // ---------- AUDIO ----------
    let audioCtx = null;
    let osc1 = null, osc2 = null, osc3 = null;
    let filter = null;
    let gain = null;
    let audioIniciado = false;

    const FREQ_RE = 293.66; // Re4

    function iniciarAudio() {
        if (audioIniciado) return;
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Ganancia principal (volumen)
        gain = audioCtx.createGain();
        gain.gain.value = 0;
        gain.connect(audioCtx.destination);

        // Filtro pasa bajos (textura)
        filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 1000;
        filter.Q.value = 1.5;
        filter.connect(gain);

        // 3 osciladores para textura rica (como Mazacote)
        osc1 = audioCtx.createOscillator();
        osc1.type = "sawtooth";
        osc1.frequency.value = FREQ_RE;
        osc1.connect(filter);

        osc2 = audioCtx.createOscillator();
        osc2.type = "triangle";
        osc2.frequency.value = FREQ_RE * 2;
        osc2.connect(filter);

        osc3 = audioCtx.createOscillator();
        osc3.type = "sine";
        osc3.frequency.value = FREQ_RE * 3;
        osc3.connect(filter);

        osc1.start();
        osc2.start();
        osc3.start();

        audioIniciado = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('estadoTexto').textContent = '⚪ silencio (mano cerrada)';
    }

    // ---------- CONTROL MANO (simulado con mouse en canvas) ----------
    const canvas = document.getElementById('manoCanvas');
    const ctx = canvas.getContext('2d');
    const estado = document.getElementById('estadoTexto');

    let x = 100;   // horizontal → abierto/cerrado
    let y = 100;   // vertical → textura
    let abierto = false;

    // Dibujar mano simplificada
    function dibujarMano(abierta, altura) {
        ctx.clearRect(0, 0, 400, 200);
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, 400, 200);

        // Línea divisoria (mitad izquierda = cerrado, derecha = abierto)
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(200, 0);
        ctx.lineTo(200, 200);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.fillStyle = "#444";
        ctx.font = "10px monospace";
        ctx.fillText("CERRADO", 60, 190);
        ctx.fillText("ABIERTO", 280, 190);

        // Palma
        ctx.fillStyle = abierta ? "#6cf" : "#555";
        ctx.shadowColor = abierta ? "#6cf" : "#333";
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.ellipse(200, 100 + (altura - 100) * 0.2, 60, 40, 0, 0, Math.PI * 2);
        ctx.fill();

        // Dedos
        ctx.shadowBlur = 10;
        ctx.fillStyle = abierta ? "#4af" : "#444";
        for (let i = 0; i < 4; i++) {
            let dx = 145 + i * 35;
            let dy = 100 + (altura - 100) * 0.2;
            ctx.beginPath();
            if (abierta) {
                // Dedos extendidos
                ctx.ellipse(dx, dy - 30 - i * 4, 10, 25 + i * 2, 0.2, 0, Math.PI * 2);
            } else {
                // Dedos cerrados (puño)
                ctx.ellipse(dx, dy + 8, 10, 12, 0, 0, Math.PI * 2);
            }
            ctx.fill();
        }

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#888";
        ctx.font = "11px monospace";
        ctx.fillText("⬆ textura oscura", 10, 20);
        ctx.fillText("⬇ textura brillante", 10, 195);
        
        // Indicador de posición
        ctx.fillStyle = abierta ? "#6cf" : "#555";
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "8px monospace";
        ctx.fillText("●", x-3, y+3);
    }

    // Actualizar sonido
    function actualizarSonido() {
        if (!audioIniciado || !audioCtx) return;

        // Volumen: abierto = 0.3, cerrado = 0 (seco)
        const targetGain = abierto ? 0.3 : 0.0;
        if (abierto) {
            gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.05);
        } else {
            gain.gain.setValueAtTime(0, audioCtx.currentTime); // seco
        }

        // Textura: filtro según altura (y)
        const normY = 1 - (y / 200);
        const freqFiltro = 200 + normY * 1800; // 200 ~ 2000 Hz
        filter.frequency.setTargetAtTime(freqFiltro, audioCtx.currentTime, 0.02);

        // Pequeña modulación de frecuencia para textura
        const desvio = (normY - 0.5) * 8;
        osc1.frequency.setTargetAtTime(FREQ_RE + desvio, audioCtx.currentTime, 0.02);
        osc2.frequency.setTargetAtTime(FREQ_RE * 2 + desvio * 1.5, audioCtx.currentTime, 0.02);
        osc3.frequency.setTargetAtTime(FREQ_RE * 3 + desvio * 2, audioCtx.currentTime, 0.02);

        // Mostrar estado
        if (abierto) {
            estado.textContent = `🔊 sonando · filtro ${Math.round(freqFiltro)} Hz`;
            estado.style.color = "#6cf";
        } else {
            estado.textContent = "🔇 silencio (mano cerrada)";
            estado.style.color = "#555";
        }
    }

    // ---------- EVENTOS ----------
    function manejarMovimiento(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        let canvasX = (clientX - rect.left) * scaleX;
        let canvasY = (clientY - rect.top) * scaleY;

        canvasX = Math.max(0, Math.min(400, canvasX));
        canvasY = Math.max(0, Math.min(200, canvasY));

        x = canvasX;
        y = canvasY;

        // Abierto si está en la mitad derecha del canvas
        abierto = (x > 200);

        if (audioIniciado) {
            dibujarMano(abierto, y);
            actualizarSonido();
        } else {
            dibujarMano(abierto, y);
        }
    }

    // Botón de inicio
    document.getElementById('startBtn').addEventListener('click', () => {
        iniciarAudio();
        // Mostrar estado inicial
        dibujarMano(false, 100);
        estado.textContent = '⚪ silencio (mano cerrada)';
        estado.style.color = "#555";
    });

    // Eventos del canvas
    canvas.addEventListener('mousemove', manejarMovimiento);
    canvas.addEventListener('mouseleave', () => {
        // No apagar, dejar que el usuario decida
    });
    canvas.addEventListener('touchmove', manejarMovimiento, { passive: false });
    canvas.addEventListener('touchstart', manejarMovimiento, { passive: false });

    // Dibujo inicial
    dibujarMano(false, 100);
</script>

</body>
</html>
