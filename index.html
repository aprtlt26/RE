<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mazacote · Re · Resonador Espectral</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: #111;
            border-radius: 30px;
            padding: 20px;
        }
        #video {
            width: 100%;
            border-radius: 20px;
            transform: scaleX(-1);
            background: #000;
            display: block;
        }
        #canvas {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            transform: scaleX(-1);
            border-radius: 20px;
            pointer-events: none;
        }
        #info {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #555;
            letter-spacing: 1px;
        }
        #info span { color: #6cf; }
        #estado {
            text-align: center;
            margin-top: 8px;
            font-size: 15px;
            color: #4af;
        }
        #startBtn {
            display: block;
            margin: 12px auto 5px;
            background: #2a4a6a;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 2px;
            width: 100%;
        }
        #startBtn:hover { background: #3a7aaa; }
        #startBtn:disabled { opacity: 0.3; cursor: not-allowed; }
        #debug {
            text-align: center;
            font-size: 11px;
            color: #333;
            margin-top: 5px;
        }
        #warning {
            text-align: center;
            font-size: 14px;
            color: #f44;
            margin-top: 5px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <button id="startBtn">📷 INICIAR</button>
    <div id="info"><span>✋ abrir</span> = sonido · <span>⬆⬇ altura</span> = brillo</div>
    <div id="estado">⚪ esperando...</div>
    <div id="debug">mano: ---</div>
    <div id="warning">⚠️ MANO CERRADA → SILENCIO</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ============================================================
// 1. MOTOR GESTUAL (NO TOCAR) - Copiado exactamente del código que funciona
// ============================================================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const estadoEl = document.getElementById('estado');
const debugEl = document.getElementById('debug');
const warningEl = document.getElementById('warning');

let manoAbierta = false;
let alturaMano = 0.5;
let smoothAltura = 0.5;

// ============================================================
// 2. MOTOR SONORO NUEVO - RESONADOR ESPECTRAL
// ============================================================
let audioCtx;
let audioIniciado = false;
const FREQ_RE = 293.66;

// Nodos principales
let masterGain;
let lowpassFinal;
let reverbGain;

// Resonadores
let resonadores = [];
let lfosInternos = [];

// Estado suavizado para el sonido
let currentGain = 0;
let targetGain = 0;
let currentBrightness = 0.5;
let targetBrightness = 0.5;

function crearEspectro() {
    // Creamos 32 parciales armónicos con amplitudes personalizadas
    const real = new Float32Array(32);
    const imag = new Float32Array(32);
    
    // Espectro tipo "cuerda metálica" con armónicos que decaen
    for (let i = 0; i < 32; i++) {
        const n = i + 1;
        // Decaimiento exponencial con algunas resonancias
        let amp = Math.exp(-n * 0.15) * (0.8 + Math.random() * 0.4);
        // Picos en armónicos específicos (como un instrumento real)
        if (n === 3 || n === 5 || n === 7 || n === 11) {
            amp *= 1.5;
        }
        if (n === 2 || n === 4 || n === 8) {
            amp *= 0.7;
        }
        real[i] = amp * 0.5;
        imag[i] = 0;
    }
    return { real, imag };
}

function crearResonador(frecuencia, amplitud) {
    // Cada resonador es un filtro bandpass con alta Q + oscilador
    const osc = audioCtx.createOscillator();
    
    // Usamos PeriodicWave para un timbre complejo
    const { real, imag } = crearEspectro();
    const wave = audioCtx.createPeriodicWave(real, imag);
    osc.setPeriodicWave(wave);
    osc.frequency.value = frecuencia;
    
    // Ganancia individual
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = amplitud;
    
    // Filtro bandpass para darle "cuerpo" al resonador
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = frecuencia;
    bp.Q.value = 4 + Math.random() * 3;
    
    osc.connect(gainNode);
    gainNode.connect(bp);
    
    osc.start();
    
    return { osc, gain: gainNode, filter: bp, baseFreq: frecuencia };
}

function iniciarAudio() {
    if (audioIniciado) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // ========== MASTER ==========
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0;
        masterGain.connect(audioCtx.destination);

        // ========== FILTRO FINAL ==========
        lowpassFinal = audioCtx.createBiquadFilter();
        lowpassFinal.type = "lowpass";
        lowpassFinal.frequency.value = 3000;
        lowpassFinal.Q.value = 0.7;
        lowpassFinal.connect(masterGain);

        // ========== REVERB ==========
        const reverb = audioCtx.createConvolver();
        const impulseLength = audioCtx.sampleRate * 8;
        const impulseBuffer = audioCtx.createBuffer(2, impulseLength, audioCtx.sampleRate);
        for (let channel = 0; channel < 2; channel++) {
            const data = impulseBuffer.getChannelData(channel);
            let brown = 0;
            for (let i = 0; i < impulseLength; i++) {
                brown += (Math.random() * 2 - 1) * 0.02;
                brown = Math.max(-1, Math.min(1, brown));
                const envelope = Math.exp(-i / (audioCtx.sampleRate * 2.0));
                const shimmer = Math.sin(i / audioCtx.sampleRate * 300) * 0.04;
                data[i] = brown * envelope * 0.4 + shimmer * envelope * 0.08;
            }
        }
        reverb.buffer = impulseBuffer;
        reverbGain = audioCtx.createGain();
        reverbGain.gain.value = 0.18;
        reverb.connect(reverbGain);
        reverbGain.connect(lowpassFinal);

        // ========== CHORUS ==========
        const chorus = audioCtx.createDelay(0.05);
        chorus.delayTime.value = 0.02;
        const chorusLFO = audioCtx.createOscillator();
        chorusLFO.frequency.value = 0.035;
        const chorusDepth = audioCtx.createGain();
        chorusDepth.gain.value = 0.006;
        chorusLFO.connect(chorusDepth);
        chorusDepth.connect(chorus.delayTime);
        chorusLFO.start();
        chorus.connect(lowpassFinal);

        // ========== 8 RESONADORES ==========
        // Frecuencias con microdesafinación
        const freqs = [
            FREQ_RE + 0.0,
            FREQ_RE * 2 - 0.8,
            FREQ_RE * 3 + 0.5,
            FREQ_RE * 4 - 1.2,
            FREQ_RE * 5 + 0.7,
            FREQ_RE * 6 - 0.4,
            FREQ_RE * 7 + 1.1,
            FREQ_RE * 8 - 0.6
        ];
        
        const amplitudes = [0.25, 0.18, 0.14, 0.10, 0.07, 0.05, 0.03, 0.02];
        
        for (let i = 0; i < 8; i++) {
            const res = crearResonador(freqs[i], amplitudes[i]);
            
            // Conectar a chorus y reverb
            res.filter.connect(chorus);
            res.filter.connect(reverb);
            
            // LFO interno para microdesafinación (vida propia)
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 0.02 + Math.random() * 0.04;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 0.3 + Math.random() * 0.6;
            lfo.connect(lfoGain);
            lfoGain.connect(res.osc.frequency);
            lfo.start();
            
            resonadores.push(res);
            lfosInternos.push({ lfo, gain: lfoGain });
        }

        // ========== RUIDO FILTRADO (aire) ==========
        const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 4, audioCtx.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        let brown = 0;
        for (let i = 0; i < noiseData.length; i++) {
            brown += (Math.random() * 2 - 1) * 0.015;
            brown = Math.max(-1, Math.min(1, brown));
            noiseData[i] = brown * 0.3;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;
        
        const noiseBP = audioCtx.createBiquadFilter();
        noiseBP.type = "bandpass";
        noiseBP.frequency.value = 300;
        noiseBP.Q.value = 0.4;
        
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.04;
        
        noise.connect(noiseBP);
        noiseBP.connect(noiseGain);
        noiseGain.connect(chorus);
        noiseGain.connect(reverb);
        noise.start();

        audioIniciado = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('startBtn').textContent = '✅ ACTIVO';
        document.getElementById('estado').textContent = '🔇 mano cerrada';
        warningEl.style.display = 'block';
        
        audioLoop();
    } catch(e) {
        console.error("Error audio:", e);
    }
}

// ========== LOOP DE AUDIO ==========
function audioLoop() {
    if (!audioIniciado) return;

    // Suavizado de la mano (NO TOCAR)
    smoothAltura += (alturaMano - smoothAltura) * 0.15;

    // ========== CONTROL DE AMPLITUD (desde la mano) ==========
    if (!manoAbierta) {
        // Mano cerrada → SILENCIO SECO
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        estadoEl.textContent = '🔇 silencio (mano cerrada)';
        estadoEl.style.color = '#555';
        warningEl.style.display = 'block';
        requestAnimationFrame(audioLoop);
        return;
    }

    warningEl.style.display = 'none';

    // Mano abierta → volumen controlado por altura
    // altura 0 (arriba) = 0.02, altura 1 (abajo) = 0.30
    const volumen = 0.02 + (1 - smoothAltura) * 0.28;
    masterGain.gain.setTargetAtTime(volumen, audioCtx.currentTime, 0.03);

    // ========== BRILLO (filtro final) ==========
    // Mano arriba = oscuro, mano abajo = brillante
    const freqFinal = 400 + (1 - smoothAltura) * 3000;
    lowpassFinal.frequency.setTargetAtTime(freqFinal, audioCtx.currentTime, 0.02);

    // ========== RESONADORES: microdesafinación por altura ==========
    const desvioGlobal = (0.5 - smoothAltura) * 0.8;
    for (let i = 0; i < resonadores.length; i++) {
        const freqBase = resonadores[i].baseFreq;
        // Desafinación suave
        resonadores[i].osc.frequency.setTargetAtTime(
            freqBase + desvioGlobal * (0.5 + i * 0.1),
            audioCtx.currentTime,
            0.05
        );
        // Q de los filtros bandpass
        const qBase = 4 + i * 0.5;
        resonadores[i].filter.Q.setTargetAtTime(
            qBase + (1 - smoothAltura) * 2,
            audioCtx.currentTime,
            0.05
        );
    }

    // ========== REVERB ==========
    reverbGain.gain.setTargetAtTime(0.12 + (1 - smoothAltura) * 0.15, audioCtx.currentTime, 0.03);

    // ========== UI ==========
    const db = Math.round((volumen / 0.30) * 100);
    estadoEl.textContent = `🔊 sonando · ${db}% · ${Math.round(freqFinal)}Hz`;
    estadoEl.style.color = '#6cf';

    requestAnimationFrame(audioLoop);
}

// ============================================================
// 3. MEDIAPIPE (NO TOCAR - exactamente igual)
// ============================================================
function onResults(results) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        drawConnectors(ctx, landmarks);
        drawLandmarks(ctx, landmarks);

        // Detectar mano abierta/cerrada
        const fingerTips = [8, 12, 16, 20];
        const mcp = [5, 9, 13, 17];
        let sumaDistancias = 0;
        for (let i = 0; i < fingerTips.length; i++) {
            const tip = landmarks[fingerTips[i]];
            const base = landmarks[mcp[i]];
            const dist = Math.hypot(tip.x - base.x, tip.y - base.y, tip.z - base.z);
            sumaDistancias += dist;
        }
        const promedio = sumaDistancias / fingerTips.length;
        const umbral = 0.055;
        manoAbierta = promedio > umbral;

        // Altura de la mano
        const minY = Math.min(...landmarks.map(l => l.y));
        const maxY = Math.max(...landmarks.map(l => l.y));
        alturaMano = Math.max(0, Math.min(1, (minY + maxY) / 2));

        debugEl.textContent = `abierta: ${manoAbierta} · altura: ${(alturaMano * 100).toFixed(0)}%`;
    } else {
        // No hay mano → silencio SECO
        if (audioIniciado) {
            masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
            estadoEl.textContent = '🚫 mano no detectada';
            estadoEl.style.color = '#333';
            warningEl.style.display = 'block';
        }
        debugEl.textContent = 'mano: ---';
    }
}

// Dibujo de MediaPipe
function drawConnectors(ctx, landmarks) {
    const connections = [
        [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
    ];
    ctx.strokeStyle = '#6cf';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 10;
    connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        ctx.beginPath();
        ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
        ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
        ctx.stroke();
    });
    ctx.shadowBlur = 0;
}

function drawLandmarks(ctx, landmarks) {
    ctx.fillStyle = '#8cf';
    ctx.shadowColor = '#8cf';
    ctx.shadowBlur = 15;
    landmarks.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, 5, 0, 2 * Math.PI);
        ctx.fill();
    });
    ctx.shadowBlur = 0;
}

// ============================================================
// 4. CÁMARA Y BOTÓN (NO TOCAR)
// ============================================================
const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
});

hands.onResults(onResults);

const camera = new Camera(video, {
    onFrame: async () => await hands.send({image: video}),
    width: 640,
    height: 480
});

document.getElementById('startBtn').addEventListener('click', async () => {
    try {
        await camera.start();
        iniciarAudio();
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        document.getElementById('startBtn').textContent = '📷 CÁMARA ACTIVA';
        document.getElementById('startBtn').disabled = true;
        document.getElementById('estado').textContent = '🔇 mano cerrada';
        warningEl.style.display = 'block';
    } catch(e) {
        alert('Permite acceso a la cámara');
    }
});

video.addEventListener('loadedmetadata', () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
});
</script>
</body>
</html>
