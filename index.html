<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mazacote · Re · Mano</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            color: #aaa;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: #111;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.05);
        }
        #video {
            width: 100%;
            border-radius: 20px;
            transform: scaleX(-1);
            background: #000;
            display: block;
        }
        #canvas {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            transform: scaleX(-1);
            border-radius: 20px;
            pointer-events: none;
        }
        .info {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #555;
        }
        .info span {
            color: #6cf;
        }
        #estado {
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
            color: #4af;
            letter-spacing: 1px;
        }
        #startBtn {
            display: block;
            margin: 15px auto 5px;
            background: #2a4a6a;
            border: none;
            color: white;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 3px;
            transition: 0.3s;
            width: 100%;
        }
        #startBtn:hover {
            background: #3a7aaa;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
        }
        #startBtn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .debug {
            text-align: center;
            font-size: 11px;
            color: #333;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <button id="startBtn">📷 INICIAR CÁMARA Y AUDIO</button>
    <div class="info">
        <span>✋ abrir/cerrar</span> = volumen · <span>⬆⬇ altura</span> = textura
    </div>
    <div id="estado">⚪ esperando...</div>
    <div class="debug" id="debugInfo">mano: ---</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
    // ==================== AUDIO ====================
    let audioCtx = null;
    let osc1 = null, osc2 = null, osc3 = null;
    let filter = null;
    let gain = null;
    let audioIniciado = false;

    const FREQ_RE = 293.66; // Re4

    function iniciarAudio() {
        if (audioIniciado) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            gain = audioCtx.createGain();
            gain.gain.value = 0;
            gain.connect(audioCtx.destination);

            filter = audioCtx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 1000;
            filter.Q.value = 2;
            filter.connect(gain);

            osc1 = audioCtx.createOscillator();
            osc1.type = "sawtooth";
            osc1.frequency.value = FREQ_RE;
            osc1.connect(filter);

            osc2 = audioCtx.createOscillator();
            osc2.type = "triangle";
            osc2.frequency.value = FREQ_RE * 2;
            osc2.connect(filter);

            osc3 = audioCtx.createOscillator();
            osc3.type = "sine";
            osc3.frequency.value = FREQ_RE * 3;
            osc3.connect(filter);

            osc1.start();
            osc2.start();
            osc3.start();

            audioIniciado = true;
            document.getElementById('estado').textContent = '🔇 mano cerrada';
            document.getElementById('estado').style.color = '#555';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').textContent = '✅ AUDIO ACTIVO';
        } catch(e) {
            console.error("Error audio:", e);
        }
    }

    // ==================== CONTROL CON MANO ====================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const estadoEl = document.getElementById('estado');
    const debugEl = document.getElementById('debugInfo');

    let manoAbierta = false;
    let alturaMano = 0.5; // 0 = arriba, 1 = abajo
    let xMano = 0.5; // 0 = izquierda, 1 = derecha

    function actualizarSonido() {
        if (!audioIniciado || !audioCtx) return;

        // Volumen: abierto = 0.25, cerrado = 0 (seco)
        const targetGain = manoAbierta ? 0.25 : 0.0;
        if (manoAbierta) {
            gain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.03);
        } else {
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
        }

        // Textura: filtro según altura (0 = arriba = oscuro, 1 = abajo = brillante)
        const freqFiltro = 200 + (1 - alturaMano) * 1800;
        filter.frequency.setTargetAtTime(freqFiltro, audioCtx.currentTime, 0.02);

        // Pequeña modulación de frecuencia para textura
        const desvio = (0.5 - alturaMano) * 10;
        osc1.frequency.setTargetAtTime(FREQ_RE + desvio, audioCtx.currentTime, 0.02);
        osc2.frequency.setTargetAtTime(FREQ_RE * 2 + desvio * 1.5, audioCtx.currentTime, 0.02);
        osc3.frequency.setTargetAtTime(FREQ_RE * 3 + desvio * 2, audioCtx.currentTime, 0.02);

        // Actualizar UI
        if (manoAbierta) {
            estadoEl.textContent = `🔊 sonando · filtro ${Math.round(freqFiltro)} Hz`;
            estadoEl.style.color = '#6cf';
        } else {
            estadoEl.textContent = '🔇 silencio (mano cerrada)';
            estadoEl.style.color = '#555';
        }
    }

    // ==================== MEDIAPIPE HANDS ====================
    function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            
            // Dibujar puntos y conexiones
            drawConnectors(ctx, landmarks);
            drawLandmarks(ctx, landmarks);

            // Calcular si la mano está abierta o cerrada
            // Usamos distancia entre puntas de dedos y base de palma
            const palmBase = landmarks[0]; // Muñeca
            const fingerTips = [8, 12, 16, 20]; // Índice, medio, anular, meñique
            const mcp = [5, 9, 13, 17]; // Base de los dedos
            
            let sumaDistancias = 0;
            for (let i = 0; i < fingerTips.length; i++) {
                const tip = landmarks[fingerTips[i]];
                const base = landmarks[mcp[i]];
                const dist = Math.hypot(tip.x - base.x, tip.y - base.y, tip.z - base.z);
                sumaDistancias += dist;
            }
            const promedio = sumaDistancias / fingerTips.length;
            
            // Umbral para considerar abierta
            manoAbierta = promedio > 0.06;

            // Altura de la mano (normalizada)
            const minY = Math.min(...landmarks.map(l => l.y));
            const maxY = Math.max(...landmarks.map(l => l.y));
            alturaMano = Math.max(0, Math.min(1, (minY + maxY) / 2));

            // Posición horizontal (para debug)
            xMano = landmarks[0].x;

            // Debug
            debugEl.textContent = `abierta: ${manoAbierta} · altura: ${(alturaMano * 100).toFixed(0)}%`;

            // Actualizar audio
            actualizarSonido();
        } else {
            // No hay mano detectada → silencio seco
            if (audioIniciado) {
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                estadoEl.textContent = '🚫 mano no detectada';
                estadoEl.style.color = '#333';
            }
            debugEl.textContent = 'mano: ---';
        }
    }

    // Funciones de dibujo de MediaPipe
    function drawConnectors(ctx, landmarks) {
        const connections = [
            [0,1],[1,2],[2,3],[3,4], // pulgar
            [0,5],[5,6],[6,7],[7,8], // índice
            [0,9],[9,10],[10,11],[11,12], // medio
            [0,13],[13,14],[14,15],[15,16], // anular
            [0,17],[17,18],[18,19],[19,20], // meñique
            [5,9],[9,13],[13,17] // palma
        ];
        ctx.strokeStyle = '#6cf';
        ctx.lineWidth = 2;
        connections.forEach(([i, j]) => {
            const p1 = landmarks[i];
            const p2 = landmarks[j];
            ctx.beginPath();
            ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
            ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
            ctx.stroke();
        });
    }

    function drawLandmarks(ctx, landmarks) {
        ctx.fillStyle = '#8cf';
        landmarks.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, 2 * Math.PI);
            ctx.fill();
        });
    }

    // ==================== INICIALIZAR CÁMARA ====================
    const hands = new Hands({
        locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const camera = new Camera(video, {
        onFrame: async () => {
            await hands.send({image: video});
        },
        width: 640,
        height: 480
    });

    // ==================== BOTÓN INICIO ====================
    document.getElementById('startBtn').addEventListener('click', async () => {
        try {
            await camera.start();
            iniciarAudio();
            document.getElementById('startBtn').textContent = '📷 CÁMARA ACTIVA';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('estado').textContent = '🔇 mano cerrada';
            
            // Ajustar canvas al tamaño del video
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
        } catch(e) {
            console.error("Error cámara:", e);
            alert('No se pudo acceder a la cámara. Permite el acceso e intenta de nuevo.');
        }
    });

    // Ajustar canvas cuando el video cargue
    video.addEventListener('loadedmetadata', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
    });
</script>

</body>
</html>
