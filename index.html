<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mazacote · Re</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: #111;
            border-radius: 30px;
            padding: 20px;
        }
        #video {
            width: 100%;
            border-radius: 20px;
            transform: scaleX(-1);
            background: #000;
            display: block;
        }
        #canvas {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            transform: scaleX(-1);
            border-radius: 20px;
            pointer-events: none;
        }
        #info {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #555;
            letter-spacing: 1px;
        }
        #info span { color: #6cf; }
        #estado {
            text-align: center;
            margin-top: 8px;
            font-size: 15px;
            color: #4af;
        }
        #startBtn {
            display: block;
            margin: 12px auto 5px;
            background: #2a4a6a;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 2px;
            width: 100%;
        }
        #startBtn:hover { background: #3a7aaa; }
        #startBtn:disabled { opacity: 0.3; cursor: not-allowed; }
        #debug {
            text-align: center;
            font-size: 11px;
            color: #333;
            margin-top: 5px;
        }
        #warning {
            text-align: center;
            font-size: 14px;
            color: #f44;
            margin-top: 5px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <button id="startBtn">📷 INICIAR</button>
    <div id="info"><span>✋ abrir</span> = sonido · <span>⬆⬇ altura</span> = volumen y textura</div>
    <div id="estado">⚪ esperando...</div>
    <div id="debug">mano: ---</div>
    <div id="warning">⚠️ MANO CERRADA → SUSTAIN + FADE</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ============================================================
// 1. MOTOR DE MANO (NO TOCAR)
// ============================================================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const estadoEl = document.getElementById('estado');
const debugEl = document.getElementById('debug');
const warningEl = document.getElementById('warning');

let manoAbierta = false;
let alturaMano = 0.5;
let smoothAltura = 0.5;

// ============================================================
// 2. MOTOR SONORO CON SUSTAIN
// ============================================================
let audioCtx;
let audioIniciado = false;
const FREQ_RE = 293.66;

let gain;
let filter;
let osc1, osc2, osc3;

// Estado de la envolvente
let sustainActivo = false;
let tiempoSustain = 0;
const SUSTAIN_DURACION = 1.5; // segundos que se mantiene antes de apagarse
const VOLUMEN_SUSTAIN = 0.02;  // volumen durante el sustain (muy bajo)

function iniciarAudio() {
    if (audioIniciado) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        gain = audioCtx.createGain();
        gain.gain.value = 0;
        gain.connect(audioCtx.destination);

        filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 1000;
        filter.Q.value = 1.5;
        filter.connect(gain);

        // Espectro complejo
        function crearEspectro() {
            const real = new Float32Array(32);
            const imag = new Float32Array(32);
            for (let i = 0; i < 32; i++) {
                const n = i + 1;
                let amp = Math.exp(-n * 0.12) * (0.7 + Math.random() * 0.6);
                if (n === 3 || n === 5 || n === 7 || n === 11) amp *= 1.6;
                if (n === 2 || n === 4 || n === 8) amp *= 0.6;
                real[i] = amp * 0.5;
                imag[i] = 0;
            }
            return real;
        }

        const espectro = crearEspectro();
        const wave = audioCtx.createPeriodicWave(espectro, new Float32Array(32));

        osc1 = audioCtx.createOscillator();
        osc1.setPeriodicWave(wave);
        osc1.frequency.value = FREQ_RE;
        osc1.connect(filter);

        const wave2 = audioCtx.createPeriodicWave(espectro, new Float32Array(32));
        osc2 = audioCtx.createOscillator();
        osc2.setPeriodicWave(wave2);
        osc2.frequency.value = FREQ_RE * 1.5;
        osc2.connect(filter);

        const wave3 = audioCtx.createPeriodicWave(espectro, new Float32Array(32));
        osc3 = audioCtx.createOscillator();
        osc3.setPeriodicWave(wave3);
        osc3.frequency.value = FREQ_RE * 2;
        osc3.connect(filter);

        osc1.start();
        osc2.start();
        osc3.start();

        // Reverb
        const reverb = audioCtx.createConvolver();
        const impulseLength = audioCtx.sampleRate * 6;
        const impulseBuffer = audioCtx.createBuffer(2, impulseLength, audioCtx.sampleRate);
        for (let channel = 0; channel < 2; channel++) {
            const data = impulseBuffer.getChannelData(channel);
            let brown = 0;
            for (let i = 0; i < impulseLength; i++) {
                brown += (Math.random() * 2 - 1) * 0.02;
                brown = Math.max(-1, Math.min(1, brown));
                const envelope = Math.exp(-i / (audioCtx.sampleRate * 2.0));
                data[i] = brown * envelope * 0.35;
            }
        }
        reverb.buffer = impulseBuffer;
        const reverbGain = audioCtx.createGain();
        reverbGain.gain.value = 0.15;
        filter.connect(reverb);
        reverb.connect(reverbGain);
        reverbGain.connect(gain);

        audioIniciado = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('startBtn').textContent = '✅ ACTIVO';
        document.getElementById('estado').textContent = '🔇 mano cerrada';
        warningEl.style.display = 'block';
        
        audioLoop();
    } catch(e) {
        console.error("Error audio:", e);
    }
}

// ========== LOOP DE AUDIO CON SUSTAIN ==========
function audioLoop() {
    if (!audioIniciado) return;

    smoothAltura += (alturaMano - smoothAltura) * 0.15;

    // ========== CIERRE DE MANO: SUSTAIN + FADE ==========
    if (!manoAbierta) {
        if (!sustainActivo) {
            // Primera vez que se cierra → activar sustain
            sustainActivo = true;
            tiempoSustain = 0;
            warningEl.style.display = 'block';
        }

        // Incrementar tiempo de sustain
        tiempoSustain += 1/60; // ~60fps

        if (tiempoSustain < SUSTAIN_DURACION) {
            // Fase de SUSTAIN: volumen bajo pero presente
            const sustainVol = VOLUMEN_SUSTAIN * (1 - tiempoSustain / SUSTAIN_DURACION * 0.5);
            gain.gain.setTargetAtTime(sustainVol, audioCtx.currentTime, 0.02);
            estadoEl.textContent = `🔊 sustain ${Math.round((1 - tiempoSustain/SUSTAIN_DURACION)*100)}%`;
            estadoEl.style.color = '#a84';
        } else {
            // Fase de RELEASE: fade lento a 0
            gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
            estadoEl.textContent = '🔇 fade out';
            estadoEl.style.color = '#555';
        }

        requestAnimationFrame(audioLoop);
        return;
    }

    // ========== MANO ABIERTA: RESETEAR SUSTAIN ==========
    if (sustainActivo) {
        sustainActivo = false;
        tiempoSustain = 0;
        warningEl.style.display = 'none';
    }

    warningEl.style.display = 'none';

    // Volumen normal por altura
    const volumen = 0.05 + (1 - smoothAltura) * 0.30;
    gain.gain.setTargetAtTime(volumen, audioCtx.currentTime, 0.03);

    const freqFiltro = 150 + (1 - smoothAltura) * 2000;
    filter.frequency.setTargetAtTime(freqFiltro, audioCtx.currentTime, 0.02);

    const desvio = (0.5 - smoothAltura) * 2.5;
    osc1.frequency.setTargetAtTime(FREQ_RE + desvio, audioCtx.currentTime, 0.02);
    osc2.frequency.setTargetAtTime(FREQ_RE * 1.5 + desvio * 0.7, audioCtx.currentTime, 0.02);
    osc3.frequency.setTargetAtTime(FREQ_RE * 2 + desvio * 0.5, audioCtx.currentTime, 0.02);

    filter.Q.setTargetAtTime(1.2 + (1 - smoothAltura) * 1.5, audioCtx.currentTime, 0.02);

    const db = Math.round((volumen / 0.35) * 100);
    estadoEl.textContent = `🔊 sonando · ${db}% · ${Math.round(freqFiltro)} Hz`;
    estadoEl.style.color = '#6cf';

    requestAnimationFrame(audioLoop);
}

// ============================================================
// 3. MEDIAPIPE (NO TOCAR)
// ============================================================
function onResults(results) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        drawConnectors(ctx, landmarks);
        drawLandmarks(ctx, landmarks);

        const fingerTips = [8, 12, 16, 20];
        const mcp = [5, 9, 13, 17];
        let sumaDistancias = 0;
        for (let i = 0; i < fingerTips.length; i++) {
            const tip = landmarks[fingerTips[i]];
            const base = landmarks[mcp[i]];
            const dist = Math.hypot(tip.x - base.x, tip.y - base.y, tip.z - base.z);
            sumaDistancias += dist;
        }
        const promedio = sumaDistancias / fingerTips.length;
        const umbral = 0.055;
        manoAbierta = promedio > umbral;

        const minY = Math.min(...landmarks.map(l => l.y));
        const maxY = Math.max(...landmarks.map(l => l.y));
        alturaMano = Math.max(0, Math.min(1, (minY + maxY) / 2));

        debugEl.textContent = `abierta: ${manoAbierta} · altura: ${(alturaMano * 100).toFixed(0)}%`;
    } else {
        if (audioIniciado) {
            gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
            estadoEl.textContent = '🚫 mano no detectada';
            estadoEl.style.color = '#333';
            warningEl.style.display = 'block';
        }
        debugEl.textContent = 'mano: ---';
    }
}

function drawConnectors(ctx, landmarks) {
    const connections = [
        [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
    ];
    ctx.strokeStyle = '#6cf';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 10;
    connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        ctx.beginPath();
        ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
        ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
        ctx.stroke();
    });
    ctx.shadowBlur = 0;
}

function drawLandmarks(ctx, landmarks) {
    ctx.fillStyle = '#8cf';
    ctx.shadowColor = '#8cf';
    ctx.shadowBlur = 15;
    landmarks.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, 5, 0, 2 * Math.PI);
        ctx.fill();
    });
    ctx.shadowBlur = 0;
}

// ============================================================
// 4. CÁMARA Y BOTÓN
// ============================================================
const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
});

hands.onResults(onResults);

const camera = new Camera(video, {
    onFrame: async () => await hands.send({image: video}),
    width: 640,
    height: 480
});

document.getElementById('startBtn').addEventListener('click', async () => {
    try {
        await camera.start();
        iniciarAudio();
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        document.getElementById('startBtn').textContent = '📷 CÁMARA ACTIVA';
        document.getElementById('startBtn').disabled = true;
        document.getElementById('estado').textContent = '🔇 mano cerrada';
        warningEl.style.display = 'block';
    } catch(e) {
        alert('Permite acceso a la cámara');
    }
});

video.addEventListener('loadedmetadata', () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
});
</script>
</body>
</html>
