<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mazacote · Re</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: #111;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(100,200,255,0.03);
        }
        #video {
            width: 100%;
            border-radius: 20px;
            transform: scaleX(-1);
            background: #000;
            display: block;
        }
        #canvas {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            transform: scaleX(-1);
            border-radius: 20px;
            pointer-events: none;
        }
        #info {
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            color: #444;
            letter-spacing: 1px;
        }
        #info span { color: #6cf; }
        #estado {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            color: #4af;
            letter-spacing: 1px;
        }
        #startBtn {
            display: block;
            margin: 12px auto 5px;
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            color: #8af;
            padding: 14px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 2px;
            width: 100%;
            transition: 0.5s;
        }
        #startBtn:hover { background: #2a4a6a; border-color: #4a8aaa; }
        #startBtn:disabled { opacity: 0.2; cursor: not-allowed; }
        #debug {
            text-align: center;
            font-size: 10px;
            color: #222;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <button id="startBtn">◈ INICIAR · MAZACOTE ◈</button>
    <div id="info"><span>✋ pulgar-índice</span> = intensidad · <span>⬆⬇</span> = brillo y batidos</div>
    <div id="estado">◈ esperando... ◈</div>
    <div id="debug">mano: ---</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ==================== AUDIO ====================
let audioCtx;
let audioIniciado = false;
const FREQ_RE = 293.66;

// ========== PARÁMETROS MAZACOTE ==========
const FADE_TIME = 0.003;     // Fades de 4-8 segundos
const TIMBRE_TIME = 0.008;   // Cambios de timbre muy lentos

// Valores suavizados (integradores)
let currentGain = 0;
let targetGain = 0;
let currentBrightness = 0.5;
let targetBrightness = 0.5;
let currentDetune = 0;
let targetDetune = 0;

// Nodos principales
let masterGain, lowpassFinal;

// Osciladores
let osciladores = [];

function iniciarAudio() {
    if (audioIniciado) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // ========== MASTER ==========
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0;
        masterGain.connect(audioCtx.destination);

        // ========== LOWPASS FINAL ==========
        lowpassFinal = audioCtx.createBiquadFilter();
        lowpassFinal.type = "lowpass";
        lowpassFinal.frequency.value = 2500;
        lowpassFinal.Q.value = 0.7;
        lowpassFinal.connect(masterGain);

        // ========== 8 OSCILADORES con modulación ==========
        const freqs = [
            FREQ_RE + 0.0,
            FREQ_RE + 0.6,
            FREQ_RE - 0.4,
            FREQ_RE + 1.2,
            FREQ_RE - 0.8,
            FREQ_RE + 0.9,
            FREQ_RE - 0.6,
            FREQ_RE + 0.3
        ];

        const types = ['sawtooth', 'sawtooth', 'triangle', 'sine', 'sawtooth', 'triangle', 'sine', 'sawtooth'];

        for (let i = 0; i < 8; i++) {
            const osc = audioCtx.createOscillator();
            osc.type = types[i % types.length];
            osc.frequency.value = freqs[i];
            
            // Ganancia individual
            const oscGain = audioCtx.createGain();
            oscGain.gain.value = 0.04 + Math.random() * 0.03;
            
            osc.connect(oscGain);
            oscGain.connect(lowpassFinal);
            
            osc.start();
            
            osciladores.push({
                osc: osc,
                gain: oscGain,
                baseFreq: freqs[i],
                lfo: null,
                lfoGain: null
            });
        }

        // ========== REVERB (impulso coloreado) ==========
        const reverb = audioCtx.createConvolver();
        const impulseLength = audioCtx.sampleRate * 10;
        const impulseBuffer = audioCtx.createBuffer(2, impulseLength, audioCtx.sampleRate);
        
        for (let channel = 0; channel < 2; channel++) {
            const data = impulseBuffer.getChannelData(channel);
            let brown = 0;
            for (let i = 0; i < impulseLength; i++) {
                brown += (Math.random() * 2 - 1) * 0.02;
                brown = Math.max(-1, Math.min(1, brown));
                const envelope = Math.exp(-i / (audioCtx.sampleRate * 2.5));
                const shimmer = Math.sin(i / audioCtx.sampleRate * 400) * 0.03;
                data[i] = brown * envelope * 0.4 + shimmer * envelope * 0.08;
            }
        }
        reverb.buffer = impulseBuffer;
        
        const reverbGain = audioCtx.createGain();
        reverbGain.gain.value = 0.22;
        
        // Conectar todos los osciladores a la reverb
        for (let i = 0; i < osciladores.length; i++) {
            osciladores[i].gain.connect(reverb);
        }
        reverb.connect(reverbGain);
        reverbGain.connect(masterGain);

        // ========== CHORUS LENTO ==========
        const chorus = audioCtx.createDelay(0.05);
        chorus.delayTime.value = 0.018;
        
        const chorusLFO = audioCtx.createOscillator();
        chorusLFO.frequency.value = 0.04;
        const chorusDepth = audioCtx.createGain();
        chorusDepth.gain.value = 0.005;
        chorusLFO.connect(chorusDepth);
        chorusDepth.connect(chorus.delayTime);
        chorusLFO.start();
        
        // Conectar osciladores al chorus
        for (let i = 0; i < osciladores.length; i++) {
            osciladores[i].gain.connect(chorus);
        }
        chorus.connect(masterGain);

        // ========== LFOs para cada oscilador ==========
        for (let i = 0; i < osciladores.length; i++) {
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 0.015 + Math.random() * 0.025;
            
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 0.3 + Math.random() * 0.5;
            
            lfo.connect(lfoGain);
            lfoGain.connect(osciladores[i].osc.frequency);
            lfo.start();
            
            osciladores[i].lfo = lfo;
            osciladores[i].lfoGain = lfoGain;
        }

        audioIniciado = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('startBtn').textContent = '◈ ACTIVO ◈';
        document.getElementById('estado').textContent = '◈ silencio ◈';
        
        audioLoop();
    } catch(e) {
        console.error("Error audio:", e);
    }
}

// ========== LOOP DE AUDIO (integradores lentos) ==========
function audioLoop() {
    if (!audioIniciado) return;

    // 1. AMPLITUD: integrador muy lento (fade de 4-8 segundos)
    currentGain += (targetGain - currentGain) * FADE_TIME;
    masterGain.gain.value = currentGain * 0.35;

    // 2. BRILLO: integrador lento
    currentBrightness += (targetBrightness - currentBrightness) * TIMBRE_TIME;
    const freqFiltro = 300 + currentBrightness * 2500;
    lowpassFinal.frequency.setValueAtTime(freqFiltro, audioCtx.currentTime);

    // 3. DESAFINACIÓN (batidos): integrador lentísimo
    currentDetune += (targetDetune - currentDetune) * (TIMBRE_TIME * 0.5);
    // Aplicar desafinación a cada oscilador
    for (let i = 0; i < osciladores.length; i++) {
        const desvio = (currentDetune - 0.5) * 0.8; // menos de un semitono
        osciladores[i].osc.frequency.setValueAtTime(
            osciladores[i].baseFreq + desvio,
            audioCtx.currentTime
        );
    }

    // 4. RESONANCIA del filtro
    lowpassFinal.Q.setValueAtTime(0.5 + currentBrightness * 0.8, audioCtx.currentTime);

    // UI
    const percent = Math.round(currentGain / 0.2 * 100);
    if (currentGain > 0.001) {
        document.getElementById('estado').textContent = `◈ sonando · ${percent}% · ${Math.round(freqFiltro)}Hz ◈`;
        document.getElementById('estado').style.color = '#6cf';
    } else {
        document.getElementById('estado').textContent = '◈ silencio ◈';
        document.getElementById('estado').style.color = '#555';
    }

    requestAnimationFrame(audioLoop);
}

// ==================== MEDIAPIPE ====================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const debugEl = document.getElementById('debug');

function calcularApertura(landmarks) {
    const thumbTip = landmarks[4];
    const indexTip = landmarks[8];
    return Math.hypot(
        thumbTip.x - indexTip.x,
        thumbTip.y - indexTip.y,
        thumbTip.z - indexTip.z
    );
}

function onResults(results) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        drawConnectors(ctx, landmarks);
        drawLandmarks(ctx, landmarks);

        // ========== CONTROL CONTINUO ==========
        // 1. APERTURA: distancia pulgar-índice → intensidad (NUNCA se apaga bruscamente)
        const apertura = calcularApertura(landmarks);
        // Mapeo: apertura 0.02-0.15 → targetGain 0-0.25
        const rawGain = Math.max(0, (apertura - 0.02) / 0.13);
        // Curva exponencial para dinámicas suaves
        targetGain = 0.005 + Math.pow(rawGain, 2.5) * 0.25;
        // NUNCA se apaga de golpe: el integrador se encarga del fade

        // 2. ALTURA: centro de la mano → brillo y desafinación
        const minY = Math.min(...landmarks.map(l => l.y));
        const maxY = Math.max(...landmarks.map(l => l.y));
        const altura = Math.max(0, Math.min(1, (minY + maxY) / 2));
        // Mano arriba = oscuro, mano abajo = brillante
        targetBrightness = 1 - altura;
        // Desafinación: más batidos cuando la mano está abajo
        targetDetune = altura;

        debugEl.textContent = `apertura: ${(apertura*100).toFixed(0)}% · altura: ${(altura*100).toFixed(0)}%`;
    } else {
        // NO HAY MANO → targetGain = 0 (pero el integrador lo desvanece en segundos)
        targetGain = 0;
        targetBrightness = 0.5;
        targetDetune = 0.5;
        debugEl.textContent = 'mano: ---';
    }
}

// ========== DIBUJO ==========
function drawConnectors(ctx, landmarks) {
    const connections = [
        [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
    ];
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.2)';
    ctx.lineWidth = 1.5;
    connections.forEach(([i, j]) => {
        const p1 = landmarks[i];
        const p2 = landmarks[j];
        ctx.beginPath();
        ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
        ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
        ctx.stroke();
    });
}

function drawLandmarks(ctx, landmarks) {
    ctx.fillStyle = 'rgba(100, 200, 255, 0.3)';
    landmarks.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, 3, 0, 2 * Math.PI);
        ctx.fill();
    });
}

// ========== CÁMARA ==========
const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
});

hands.onResults(onResults);

const camera = new Camera(video, {
    onFrame: async () => await hands.send({image: video}),
    width: 640,
    height: 480
});

// ========== BOTÓN ==========
document.getElementById('startBtn').addEventListener('click', async () => {
    try {
        await camera.start();
        iniciarAudio();
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        document.getElementById('startBtn').textContent = '◈ CÁMARA ACTIVA ◈';
        document.getElementById('startBtn').disabled = true;
    } catch(e) {
        alert('Permite acceso a la cámara');
    }
});

video.addEventListener('loadedmetadata', () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
});
</script>
</body>
</html>
